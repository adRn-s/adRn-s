name: Metrics

on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: adRn-s
          template: classic
          
          base: header, activity, community
          base_indepth: yes
          config_octicon: yes
          config_timezone: Europe/Berlin
          config_twemoji: yes
          
          plugin_repositories: no  #!
          plugin_repositories_owner: maxplanck-ie, deeptools
          plugin_repositories_affiliations: organization_member
          plugin_repositories_limit: 5
          plugin_repositories_forks: no
          plugin_repositories_featured: maxplanck-ie/parkour2, deeptools/deepTools

          plugin_followup: yes
          plugin_followup_sections: user
          
          plugin_habits: yes
          plugin_habits_from: 500
          plugin_habits_days: 30
          plugin_habits_languages_threshold: 5
          plugin_habits_charts: yes
          plugin_habits_trim: yes
          plugin_habits_facts: yes
          
          plugin_isocalendar: no  #!
          plugin_isocalendar_duration: full-year
          
          plugin_code: yes
          plugin_code_days: 180
          plugin_code_languages: python
          
          plugin_languages: no  #!
          commits_authoring: A.s, 62971995+adRn-s@users.noreply.github.com, adRn-s, 62971995+adRn-s@users.noreply.github.com, lims@omics.dev, salatino@omics.dev, salatino@ie-freiburg.mpg.de, user@domain.com, root@parkour.ie-freiburg.mpg.de
          plugin_languages_ignored: html, css, javascript, typescript
          plugin_languages_sections: recently-used
          plugin_languages_recent_days: 500
          plugin_languages_indepth: no  #!
          plugin_languages_details: lines
          
          
          plugin_lines: no  #!
          plugin_lines_history_limit: 3
          plugin_lines_repositories_limit: 5
          plugin_lines_sections: repositories
          
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          
          plugin_reactions: no  #!
          plugin_reactions_ignored: sweep-ai-deprecated[bot]


# https://metrics.lecoq.io
# https://github.com/lowlighter/metrics#-documentation
# https://github.com/lowlighter/metrics/blob/master/.github/readme/partials/documentation/setup/action.md
